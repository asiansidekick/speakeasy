<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Speakeasy Live Camera Test</title>
<meta name="robots" content="noindex">
<style>
[hidden]{display:none!important}
:root{--bg:#000;--fg:#fff;--muted:#c9d2e3;--accent:#2f6fe4;--chip:rgba(16,24,44,.78);--lab:#ffe27a;color-scheme:dark}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:18px -apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;overflow:hidden}
#stage{position:fixed;inset:0}
video,#ov{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
#ov{pointer-events:none;transition:opacity .15s}
#top{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#000c,#0000);display:flex;justify-content:space-between;gap:12px;align-items:center}
#top b{font-size:20px}
#st{font-size:15px;color:var(--muted);text-align:right;font-variant-numeric:tabular-nums}
#bot{position:fixed;left:0;right:0;bottom:0;padding:12px max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 16px) max(16px,env(safe-area-inset-left,0px));background:linear-gradient(#0000,#000d);display:flex;flex-direction:column;gap:10px}
.big{min-height:84px;border:0;border-radius:20px;background:var(--accent);color:#fff;font-family:inherit;font-weight:700;font-size:26px;width:100%}
.big:focus-visible{outline:3px solid #fff;outline-offset:3px}
#list{max-height:38vh;overflow:auto;background:var(--chip);border-radius:14px;display:none}
#list div{padding:10px 14px;border-top:1px solid #ffffff22}
#list div:first-child{border-top:0}
#list .th{font-size:20px;font-weight:600}
#list .en{font-size:20px;color:var(--lab)}
#intro{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px max(20px,env(safe-area-inset-right,0px)) 24px max(20px,env(safe-area-inset-left,0px));background:#0d1426}
#intro h1{margin:0;font-size:28px}
#intro p{margin:0;color:var(--muted)}
</style>
</head><body>
<div id="stage" hidden><video id="v" playsinline muted autoplay></video><canvas id="ov"></canvas></div>
<div id="top" hidden><b>Live camera test</b><span id="st">Starting…</span></div>
<div id="bot" hidden><div id="list"></div><button class="big" id="pause">Pause</button></div>
<div id="intro">
  <h1>Live camera test</h1>
  <p>Point your phone at Thai text and the English appears on top. Uses online translation when you have signal, offline when you don't.</p>
  <p id="prep">Getting the text reader ready…</p>
  <button class="big" id="go" disabled>Start camera</button>
  <p style="font-size:15px">Test page version 4. The Speakeasy app is not changed.</p>
</div>
<script>
// visiting this page within Speakeasy's offline cache scope would make the cache keep THIS page as the app; put the app back
(async()=>{try{if(!navigator.onLine||!("caches" in self))return;const u=new URL("../index.html",location.href).href;const r=await fetch(u,{cache:"no-cache"});if(r.ok){const c=await caches.open("speakeasy-v1");await c.put(u,r)}}catch(e){}})();
setTimeout(async()=>{try{const u=new URL("../index.html",location.href).href;const r=await fetch(u,{cache:"no-cache"});if(r.ok)(await caches.open("speakeasy-v1")).put(u,r)}catch(e){}},4000);

const $=id=>document.getElementById(id);
const THAI=/[฀-๿]/;
const clean=s=>String(s||"").replace(/ํา/g,"ำ").replace(/([฀-๿]) (?=[฀-๿])/g,"$1").replace(/\s+/g," ").trim();
const blobURL=(d,t)=>URL.createObjectURL(new Blob([d],{type:t}));
let ready=false,paused=false,stream=null,last=[];
const TC=new Map(); // Thai line -> English

// the text reader runs in a background worker so the camera picture never stutters
let W=null,WN=0;const WP=new Map();
function wcall(msg,transfer){return new Promise((ok,no)=>{const id=++WN;WP.set(id,{ok,no});W.postMessage({id,...msg},transfer||[])})}
let MAIN=false;
const timeout=(p,ms,what)=>Promise.race([p,new Promise((_,no)=>setTimeout(()=>no(new Error(what+" timed out")),ms))]);
async function initOCR(){
  const get=async n=>{const r=await fetch(n);if(!r.ok)throw new Error(n+" HTTP "+r.status);return new Uint8Array(await r.arrayBuffer())};
  const [det,rec,dict]=await Promise.all([get("det.rten"),get("th-rec.rten"),fetch("th-dict.txt").then(r=>r.text())]);
  try{
    W=new Worker("ocr-worker.js");
    W.onmessage=e=>{const d=e.data,p=WP.get(d.id);if(!p)return;WP.delete(d.id);d.type==="ERROR"?p.no(new Error(d.error)):p.ok(d.results)};
    W.onerror=e=>{for(const [,p] of WP)p.no(new Error(e.message||"worker"));WP.clear()};
    await timeout(wcall({type:"INIT",config:{wasmUrl:new URL("rten.wasm",location.href).href,models:{detection:det.slice(),recognition:rec.slice(),dictionary:dict}}}),30000,"background reader");
    // make sure it really reads before trusting it
    const c=document.createElement("canvas");c.width=64;c.height=32;const d=c.getContext("2d").getImageData(0,0,64,32);
    await timeout(wcall({type:"DETECT",image:{data:d.data,width:64,height:32},options:{output:"lines"}}),15000,"background reader");
  }catch(e){
    // fall back to the version that worked on iPhone: the reader on the page itself
    try{W&&W.terminate()}catch(x){}W=null;MAIN=true;
    await new Promise((ok,no)=>{const s=document.createElement("script");s.src="rusto.js";s.onload=ok;s.onerror=()=>no(new Error("rusto.js"));document.head.appendChild(s)});
    const w=await get("rten.wasm");
    await RustoWeb.initialize({wasmUrl:blobURL(w,"application/wasm"),worker:false,models:{detection:det,recognition:rec,dictionary:dict}});
  }
}
async function detect(img,canvas,opts){return MAIN?RustoWeb.detectText(canvas,opts):wcall({type:"DETECT",image:{data:img.data,width:img.width,height:img.height},options:opts})}
// online: one Google request for all new lines
async function trOnline(lines){
  const u="https://translate.googleapis.com/translate_a/single?client=gtx&dt=t&sl=th&tl=en&q="+encodeURIComponent(lines.join("\n"));
  const ctl=new AbortController(),t=setTimeout(()=>ctl.abort(),5000);
  try{const j=await (await fetch(u,{signal:ctl.signal})).json();const out=(j[0]||[]).map(x=>x[0]).join("").split("\n").map(s=>s.trim());
    if(out.length!==lines.length)return null;return out}finally{clearTimeout(t)}
}
// offline: the same Thai model Speakeasy downloads, loaded only when needed
let OFF=null,OQ=Promise.resolve();
function offEngine(){
  if(OFF)return OFF;
  OFF=(async()=>{
    const L=n=>new URL("../"+n,location.href).href;
    const txt=async n=>(await fetch(L(n))).text();
    const gun=async n=>new Uint8Array(await new Response((await fetch(L(n))).body.pipeThrough(new DecompressionStream("gzip"))).arrayBuffer());
    const wasm=blobURL(await (await fetch(L("bergamot-translator-worker.wasm"))).arrayBuffer(),"application/wasm");
    const glue=blobURL(await txt("bergamot-translator-worker.js"),"text/javascript");
    let w=await txt("translator-worker.js");
    w=w.replace("new URL('./bergamot-translator-worker.wasm', self.location)",JSON.stringify(wasm)).replace("self.importScripts('bergamot-translator-worker.js')","self.importScripts("+JSON.stringify(glue)+")");
    let m=await txt("translator.js");m=m.replace("new URL('./worker/translator-worker.js', import.meta.url)",JSON.stringify(blobURL(w,"text/javascript")));
    const mod=await import(blobURL(m,"text/javascript"));
    const files={model:await gun("then-model.bin.gz"),lex:await gun("then-lex.bin.gz"),vocab:await gun("then-vocab.spm.gz")};
    const reg=[{from:"th",to:"en",files:{model:{name:"model",size:files.model.length},lex:{name:"lex",size:files.lex.length},vocab:{name:"vocab",size:files.vocab.length}}}];
    class B extends mod.TranslatorBacking{async loadModelRegistery(){return reg}getTranslationModel(x,o){return this.loadTranslationModel(x,o)}async fetch(u){const f=files[u];return f.buffer.slice(f.byteOffset,f.byteOffset+f.byteLength)}}
    const o={pivotLanguage:null,downloadTimeout:0,cacheSize:0};return new mod.LatencyOptimisedTranslator(o,new B(o));
  })();
  OFF.catch(()=>{OFF=null});return OFF;
}
async function trOffline(l){const tr=await offEngine();const p=OQ.then(()=>tr.translate({from:"th",to:"en",text:l,html:false}));OQ=p.catch(()=>{});const r=await p;return String(r&&r.target&&r.target.text||"").trim()}
let mode="";
async function translate(lines){
  const need=[...new Set(lines.filter(l=>THAI.test(l)&&!TC.has(l)))];
  if(!need.length)return;
  let out=null;
  if(navigator.onLine){try{out=await trOnline(need);mode="online"}catch(e){}}
  if(!out){out=[];for(const l of need)out.push(await trOffline(l));mode="offline"}
  need.forEach((l,i)=>{if(out[i])TC.set(l,out[i])});
}

const grab=document.createElement("canvas");
// tiny grey thumbnails tell us when the phone has moved since the frame that was read
const TH=document.createElement("canvas");TH.width=TH.height=24;const THX=TH.getContext("2d",{willReadFrequently:true});
function thumb(src){THX.drawImage(src,0,0,24,24);const d=THX.getImageData(0,0,24,24).data,o=new Uint8Array(576);for(let i=0;i<576;i++)o[i]=(d[i*4]+d[i*4+1]+d[i*4+2])/3;return o}
function moved(a,b){if(!a||!b)return 99;let t=0;for(let i=0;i<576;i++)t+=Math.abs(a[i]-b[i]);return t/576}
let shown=null,shownThumb=null,shownWH=[1,1],hiddenOv=false;
async function tick(){
  if(paused||!stream)return setTimeout(tick,300);
  const v=$("v");if(!v.videoWidth)return setTimeout(tick,200);
  const t0=performance.now();
  const sc=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));
  grab.width=Math.round(v.videoWidth*sc);grab.height=Math.round(v.videoHeight*sc);
  const gx=grab.getContext("2d",{willReadFrequently:true});gx.drawImage(v,0,0,grab.width,grab.height);
  const th=thumb(grab);
  const img=gx.getImageData(0,0,grab.width,grab.height);
  let res=[];
  try{res=await detect(img,grab,{output:"lines",textScore:0.6,maxSideLen:736})}catch(e){res=null;window.__err="error: "+(e&&e.message||e)}
  const t1=performance.now();
  // only lines with Thai in them get a label
  const items=(res||[]).map(r=>({t:clean(r.text),f:r.frame})).filter(x=>x.t.length>1&&THAI.test(x.t));
  if(!paused){
    last=items;shown=items;shownWH=[grab.width,grab.height];draw();
    translate(items.map(x=>x.t)).then(()=>{if(shown===items&&!paused)draw()}).catch(()=>{});
  }
  $("st").textContent=res===null?window.__err:`${(res||[]).length?((last.length)+" Thai lines · "):""}read ${((t1-t0)/1000).toFixed(1)} s · ${mode||(navigator.onLine?"online":"offline")}`;
  setTimeout(tick,50);
}
// hide the labels only while the phone is being swung around (big change between two quick looks)
let prevT=null,still=0;
setInterval(()=>{const v=$("v");if(paused||!v.videoWidth)return;const t=thumb(v),m=moved(prevT,t);prevT=t;
  if(m>12){still=0;if(!hiddenOv){hiddenOv=true;$("ov").style.opacity="0"}}else if(++still>=2&&hiddenOv){hiddenOv=false;$("ov").style.opacity="1"}},150);
function draw(){
  const items=shown||[],[Wi,Hi]=shownWH;
  const c=$("ov"),dpr=window.devicePixelRatio||1,cw=c.clientWidth,ch=c.clientHeight;
  c.width=cw*dpr;c.height=ch*dpr;const x=c.getContext("2d");x.scale(dpr,dpr);
  // same "cover" crop as the video
  const s=Math.max(cw/Wi,ch/Hi),ox=(cw-Wi*s)/2,oy=(ch-Hi*s)/2;
  const F=n=>`700 ${n}px -apple-system,system-ui,sans-serif`;
  for(const it of items){
    const en=TC.get(it.t);if(!en)continue;
    const L=ox+it.f.left*s,T=oy+it.f.top*s,Wd=it.f.width*s,Hd=it.f.height*s;
    // the label covers the Thai line and stays its size, so labels don't pile on top of each other
    const maxW=Math.min(cw-16,Math.max(Wd*1.25,110));
    let fs=Math.max(13,Math.min(30,Hd*0.72));x.font=F(fs);
    while(fs>11&&x.measureText(en).width>maxW-12){fs-=1;x.font=F(fs)}
    const bw=Math.min(maxW,x.measureText(en).width+12),bh=fs*1.35;
    const Lx=Math.max(8,Math.min(L,cw-bw-8)),Ty=Math.max(4,Math.min(T+(Hd-bh)/2,ch-bh-4));
    x.fillStyle="rgba(16,24,44,.94)";x.beginPath();x.roundRect?x.roundRect(Lx,Ty,bw,bh,6):x.rect(Lx,Ty,bw,bh);x.fill();
    x.fillStyle="#ffe27a";x.textBaseline="middle";x.fillText(en,Lx+6,Ty+bh/2,bw-12);
  }
}
function showList(){
  const el=$("list");const rows=last;
  el.innerHTML=rows.length?rows.map(i=>`<div><div class="th" lang="th"></div><div class="en"></div></div>`).join(""):"<div>No Thai text in view</div>";
  [...el.children].forEach((d,k)=>{if(!rows[k])return;d.querySelector(".th").textContent=rows[k].t;d.querySelector(".en").textContent=TC.get(rows[k].t)||"…"});
  el.style.display="block";
}
$("pause").onclick=()=>{paused=!paused;const v=$("v");
  if(paused){v.pause();$("ov").style.opacity="1";$("pause").textContent="Resume";showList()}else{v.play();$("pause").textContent="Pause";$("list").style.display="none"}};
$("go").onclick=async()=>{
  try{
    stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:"environment"},width:{ideal:1920},height:{ideal:1080}}});
    $("v").srcObject=stream;await $("v").play();
    $("intro").hidden=true;$("stage").hidden=false;$("top").hidden=false;$("bot").hidden=false;
    tick();
  }catch(e){$("prep").textContent="Couldn't open the camera: "+(e&&e.message||e)}
};
// stop the camera when leaving, so it never holds the iPhone's camera or audio
addEventListener("pagehide",()=>{try{stream&&stream.getTracks().forEach(t=>t.stop())}catch(e){}});
initOCR().then(()=>{ready=true;$("prep").textContent=MAIN?"Ready (slower mode).":"Ready.";$("go").disabled=false}).catch(e=>{$("prep").textContent="Couldn't load the text reader: "+(e&&e.message||e)});
</script>
</body></html>
